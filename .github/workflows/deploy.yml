name: Build and publish bilingual Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the book toolchain
        run: pip install -r requirements.txt

      - name: Build the bilingual site
        run: jupyter-book build .

      - name: Publish to gh-pages
        run: ghp-import -n -p -f _build/html
