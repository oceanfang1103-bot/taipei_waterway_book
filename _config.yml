title: "Historic Waterways and Urban Flood Susceptibility in Taipei"
author: "Ocean Fang"

execute:
  execute_notebooks: "off"

exclude_patterns:
  - "venv/**"
  - ".venv/**"
  - "_build/**"

repository:
  url: "https://github.com/oceanfang1103-bot/taipei_waterway_book"
  branch: main

sphinx:
  config:
    html_extra_path: ["images"]
    html_js_files:
      - language-switcher.js
    html_css_files:
      - language-switcher.css

html:
  use_issues_button: false
  use_repository_button: true
